services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: puskesmas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - puskesmas_network
    depends_on:
      - db
      - redis
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-puskesmas}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: puskesmas_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - puskesmas_network
    depends_on:
      - app

  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: puskesmas_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-da25f4bcdfe0147}
      POSTGRES_DB: ${DB_DATABASE:-puskesmas}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - puskesmas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 5s

  # Redis Service
  redis:
    image: redis:alpine
    container_name: puskesmas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - puskesmas_network
    volumes:
      - puskesmas_redis_data:/data

  # PgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: puskesmas_pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@puskesmas.local
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD:-postgres}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - puskesmas_pgadmin_data:/var/lib/pgadmin
    networks:
      - puskesmas_network
    depends_on:
      - db

networks:
  puskesmas_network:
    driver: bridge

volumes:
  puskesmas_redis_data:
    driver: local
  puskesmas_pgadmin_data:
    driver: local
